name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Public values only: the local Supabase API URL and a placeholder key so the
  # build can resolve NEXT_PUBLIC_* at compile time. Never put real secrets here.
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22", cache: "npm" }
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22", cache: "npm" }
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22", cache: "npm" }
      - run: npm ci
      - run: npm test

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22", cache: "npm" }
      - run: npm ci
      - run: npm run build

  database:
    name: database (migrations + RLS pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22", cache: "npm" }
      - run: npm ci
      - name: Start local Postgres and apply migrations
        run: npx supabase db start
      - name: Run pgTAP tests
        run: npx supabase test db
      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup

  e2e:
    name: e2e (Playwright, mobile + desktop)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22", cache: "npm" }
      - run: npm ci
      # Postgres + Auth + REST behind the API gateway; the rest is not needed.
      - name: Start local Supabase
        run: npx supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      # The workflow-level env holds placeholders; the local stack's real keys
      # are passed to the steps that need them (the service key stays masked
      # and never reaches the browser bundle).
      - name: Read local Supabase keys
        id: supabase
        run: |
          status="$(npx supabase status -o json 2>/dev/null)"
          service_key="$(jq -r '.SERVICE_ROLE_KEY' <<<"$status")"
          echo "::add-mask::$service_key"
          {
            echo "api_url=$(jq -r '.API_URL' <<<"$status")"
            echo "publishable_key=$(jq -r '.PUBLISHABLE_KEY' <<<"$status")"
            echo "service_role_key=$service_key"
          } >> "$GITHUB_OUTPUT"
      # The testing API lets @next/playwright's instant() hold back request-time
      # content; it is compiled in at build time and only for this test build.
      - name: Build
        run: npm run build
        env:
          EXPOSE_TESTING_API: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.supabase.outputs.api_url }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ steps.supabase.outputs.publishable_key }}
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      # Playwright starts `next start` itself (webServer) and skips the build.
      - name: Run Playwright
        run: npm run test:e2e
        env:
          E2E_SKIP_BUILD: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.supabase.outputs.api_url }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ steps.supabase.outputs.publishable_key }}
          SUPABASE_URL: ${{ steps.supabase.outputs.api_url }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supabase.outputs.service_role_key }}
      # PNG records of each screen only (captureScreen in e2e/support/fixtures.ts).
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screenshots
          path: test-results/screenshots/
          if-no-files-found: ignore
          retention-days: 14
      # Traces (test-results/, embedded in the report too) record request
      # headers and storage, including the E2E users' session cookies: upload
      # them only when a test failed, and keep them briefly.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22", cache: "npm" }
      # Production dependencies: no exceptions, they ship to users.
      - run: npm audit --audit-level=high --omit=dev
      # Everything, dev tooling included, minus dated waivers for advisories
      # with no fixed release (see scripts/audit-all.mjs).
      - run: npm run audit:all
